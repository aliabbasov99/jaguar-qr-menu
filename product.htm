    <script>
      const wrapper = document.getElementById("videoWrapper");
      const video = document.getElementById("heroVideo");
      const overlay = document.getElementById("videoOverlay");
      const fullscreenBtn = document.getElementById("fullscreenBtn");

      // Videoya klikləyəndə Play / Pause
      wrapper.addEventListener("click", function (e) {
        // Əgər tam ekran düyməsinə basılıbsa, play/pause tetiklenməsin
        if (e.target.closest("#fullscreenBtn")) return;

        if (video.paused) {
          video.play();
          overlay.classList.add("!hidden");
        } else {
          video.pause();
          overlay.classList.remove("!hidden");
        }
      });

      // Sağ aşağıdakı düyməyə basanda Tam Ekran + Çevirmə (Rotate)
      fullscreenBtn.addEventListener("click", async function (e) {
        e.stopPropagation(); // Video play/pause klikini dayandırır

        try {
          if (!document.fullscreenElement) {
            // Fullscreen-ə keçid
            if (wrapper.requestFullscreen) {
              await wrapper.requestFullscreen();
            } else if (wrapper.webkitRequestFullscreen) {
              /* Safari */
              await wrapper.webkitRequestFullscreen();
            }

            // Mobil cihazlarda ekranı üfüqi (landscape) rejminə çeviririk
            if (screen.orientation && screen.orientation.lock) {
              screen.orientation.lock("landscape").catch(() => {});
            }
          } else {
            // Fullscreen-dən çıxış
            if (document.exitFullscreen) {
              await document.exitFullscreen();
            }
            if (screen.orientation && screen.orientation.unlock) {
              screen.orientation.unlock();
            }
          }
        } catch (err) {
          console.log("Tam ekran xətası:", err);
        }
      });
    </script>

    <script>
      const wrapper = document.getElementById("videoWrapper");
      const video = document.getElementById("heroVideo");
      const overlay = document.getElementById("videoOverlay");

      wrapper.addEventListener("click", function () {
        if (video.paused) {
          video.play();
          // Oynadıqda overlay-i və ikonu tamamilə gizlədirik
          overlay.classList.add("!hidden");
        } else {
          video.pause();
          // Pauzada ikonu yenidən göstəririk
          overlay.classList.remove("!hidden");
        }
      });
    </script>

    <script>
      function toggleVideo() {
        const video = document.getElementById("heroVideo");
        const controls = document.getElementById("videoControls");
        const playBtn = document.getElementById("playBtn");

        video.muted = true;

        if (video.paused) {
          video.play().then(() => {
            // Düyməni və overlay-i tamamilə itiririk
            controls.classList.add("opacity-0", "pointer-events-none");
            playBtn.classList.add("hidden"); // Düymə ikonunu tamamilə silir
          });
        } else {
          video.pause();
          // Pauza verildikdə ikon geri qayıdır
          controls.classList.remove("opacity-0", "pointer-events-none");
          playBtn.classList.remove("hidden");
        }
      }
    </script>
